name: Build and publish MiniMe Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: minime-android-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ipseslbjrzzqutaatdiz.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3ueSbzBPMC_5tT5-8dhOBA_uOa2NJHi
      EXPO_PUBLIC_API_URL: https://minime-lab-api.onrender.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install reproducible dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Expo dependency compatibility
        run: npx --yes expo-doctor
      - name: Typecheck and sync regression tests
        run: |
          npm run typecheck
          npm run test:sync
      - name: Build Android preview APK locally (no EAS cloud quota)
        run: |
          export EAS_NO_VCS=1
          eas build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/MiniMe-Lab-Android.apk"
      - name: Verify APK and record checksum
        run: |
          test -s "$RUNNER_TEMP/MiniMe-Lab-Android.apk"
          file "$RUNNER_TEMP/MiniMe-Lab-Android.apk"
          unzip -t "$RUNNER_TEMP/MiniMe-Lab-Android.apk" | tail -n 2
          sha256sum "$RUNNER_TEMP/MiniMe-Lab-Android.apk" > "$RUNNER_TEMP/MiniMe-Lab-Android.sha256"
          cat "$RUNNER_TEMP/MiniMe-Lab-Android.sha256"
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMe-Lab-Android-APK
          path: |
            ${{ runner.temp }}/MiniMe-Lab-Android.apk
            ${{ runner.temp }}/MiniMe-Lab-Android.sha256
          retention-days: 30
      - name: Attach APK to GitHub prerelease
        shell: bash
        run: |
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/MiniMe-Lab-Android.apk#MiniMe Lab Android APK" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MiniMe Lab Android preview #${GITHUB_RUN_NUMBER}" \
            --notes "Preview APK from local EAS build. Source commit: $GITHUB_SHA. For testing only; physical-device and clinical validation are incomplete."

name: Refresh mobile dependency lockfile
on:
  push:
    branches: [main]
    paths:
      - mobile/package.json
      - .github/workflows/refresh-mobile-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild npm lockfile
        run: cd mobile && npm install --package-lock-only --no-audit --no-fund
      - name: Commit generated lockfile if changed
        run: |
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(mobile): synchronize npm lockfile"
            git push
          fi

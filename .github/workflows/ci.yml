name: MiniMe Lab CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: python -m unittest discover -s cpp -p "test_*.py"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx --yes tsx --test features/periods/analytics.test.ts features/periods/encryptedBackup.test.ts features/pregnancy/storage.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: test -f out/index.html
      - run: grep -q 'Genetics Playground' out/labs.html
      - run: test -f out/_headers
      - run: test -f out/privacy.html -o -f out/privacy/index.html
      - run: test -f out/editorial.html -o -f out/editorial/index.html
      - run: grep -q 'Virtual adoption' out/labs.html
      - run: grep -q 'How do families begin?' out/labs.html
      - run: grep -q 'Privacy and data' out/privacy.html || grep -q 'Privacy and data' out/privacy/index.html
      - run: grep -q 'Our science and learning principles' out/editorial.html || grep -q 'Our science and learning principles' out/editorial/index.html
